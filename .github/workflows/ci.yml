name: CI

on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opencouch
          POSTGRES_USER: opencouch
          POSTGRES_PASSWORD: opencouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencouch -d opencouch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENCOUCH_TEST_POSTGRES_URL: postgresql://opencouch:opencouch@localhost:5432/opencouch
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Build
        run: pnpm --filter web build
