name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: opencouch
          POSTGRES_USER: opencouch
          POSTGRES_PASSWORD: opencouch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencouch -d opencouch"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPENCOUCH_ENABLE_POSTGRES_INTEGRATION_TESTS: "1"
      OPENCOUCH_TEST_POSTGRES_URL: postgresql://opencouch:opencouch@localhost:5432/opencouch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync backend dependencies
        working-directory: apps/backend
        run: uv sync --group dev

      - name: Run backend tests
        working-directory: apps/backend
        run: uv run pytest -q tests/unit tests/integration

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web lint
        working-directory: apps/web
        run: pnpm lint

      - name: Run web build
        working-directory: apps/web
        run: pnpm build
