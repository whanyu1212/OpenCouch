repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff-check
        name: ruff check
        args: [--fix]
        files: ^(apps/backend|eval/runners)/.*\.py$
      - id: ruff-format
        name: ruff format
        files: ^(apps/backend|eval/runners)/.*\.py$

  - repo: local
    hooks:
      - id: clean-appledouble-files
        name: clean macOS AppleDouble files
        entry: bash scripts/clean_appledouble_files.sh
        language: system
        pass_filenames: false
        always_run: true
