name: opencouch-dev

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: apps/backend/Dockerfile.dev
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false
    - path: apps/backend/.env
      required: false
    - path: apps/backend/.env.local
      required: false
  environment:
    OPENCOUCH_PERSISTENCE_BACKEND: ${OPENCOUCH_PERSISTENCE_BACKEND:-postgres}
    OPENCOUCH_MEMORY_DATABASE_URL: ${OPENCOUCH_MEMORY_DATABASE_URL:-postgresql://opencouch:opencouch@postgres:5432/opencouch}
  volumes:
    - .:/workspace
    - backend-cache:/root/.cache
  working_dir: /workspace/apps/backend

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: opencouch
      POSTGRES_USER: opencouch
      POSTGRES_PASSWORD: opencouch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencouch -d opencouch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  voice-agent:
    <<: *backend-service
    command:
      - python
      - -m
      - voice.livekit.agent
      - start
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command:
      - sh
      - -lc
      - >
        corepack enable &&
        corepack prepare pnpm@10.33.0 --activate &&
        pnpm --filter web install --frozen-lockfile &&
        pnpm --dir apps/web dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web-root-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-next-cache:/workspace/apps/web/.next
    depends_on:
      - api

  web-prod:
    profiles:
      - prod-web
    image: node:22-bookworm-slim
    working_dir: /workspace
    command:
      - sh
      - -lc
      - >
        corepack enable &&
        corepack prepare pnpm@10.33.0 --activate &&
        pnpm --filter web install --frozen-lockfile &&
        NEXT_PUBLIC_API_URL=http://localhost:8080/api pnpm --dir apps/web build &&
        NEXT_PUBLIC_API_URL=http://localhost:8080/api pnpm --dir apps/web start --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web-root-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-next-cache:/workspace/apps/web/.next
    depends_on:
      - api

volumes:
  backend-cache:
  postgres-data:
  web-root-node-modules:
  web-app-node-modules:
  web-next-cache:
