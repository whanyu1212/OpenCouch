name: opencouch

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: opencouch
      POSTGRES_USER: opencouch
      POSTGRES_PASSWORD: opencouch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencouch -d opencouch"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  agent:
    build: apps/agent
    env_file:
      - path: apps/agent/.env
        required: false
    environment:
      OPENCOUCH_DATABASE_URL: postgresql://opencouch:opencouch@postgres:5432/opencouch
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
