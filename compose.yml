name: opencouch-dev

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: apps/backend/Dockerfile.dev
  env_file:
    - path: .env
      required: false
    - path: .env.local
      required: false
    - path: apps/backend/.env
      required: false
    - path: apps/backend/.env.local
      required: false
  volumes:
    - .:/workspace
    - backend-cache:/root/.cache
  working_dir: /workspace/apps/backend

services:
  api:
    <<: *backend-service
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --reload
    ports:
      - "8080:8080"

  voice-agent:
    <<: *backend-service
    command:
      - python
      - -m
      - voice.livekit.agent
      - start
    depends_on:
      - api

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command:
      - sh
      - -lc
      - >
        corepack enable &&
        corepack prepare pnpm@10.33.0 --activate &&
        pnpm --filter web install --frozen-lockfile &&
        pnpm --dir apps/web dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - web-root-node-modules:/workspace/node_modules
      - web-app-node-modules:/workspace/apps/web/node_modules
      - web-next-cache:/workspace/apps/web/.next
    depends_on:
      - api

volumes:
  backend-cache:
  web-root-node-modules:
  web-app-node-modules:
  web-next-cache:
