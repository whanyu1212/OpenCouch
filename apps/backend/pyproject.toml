[project]
name = "opencouch-backend"
version = "0.1.0"
description = "Backend service for OpenCouch"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "graphiti-core>=0.28.2",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "openai>=1.0,<2.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.0,<14.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live_api: tests that call a real external model API",
]
