[project]
name = "opencouch-backend"
version = "0.1.0"
description = "Backend service for OpenCouch"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22,<1.0",
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "graphiti-core>=0.28.2",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "livekit-agents[openai,silero,turn-detector]~=1.5",
  "openai>=2.0",
  "opik>=2.0.15",
  "psycopg-binary>=3.2,<4.0",
  "psycopg[pool]>=3.2,<4.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot[socks]>=22.7,<23.0",
  "rich>=13.0,<14.0",
  "torch>=2.11.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "mypy>=1.20.2",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live_api: tests that call a real external model API",
]

[tool.coverage.run]
branch = true
source = [
  "agent",
  "api",
  "channels",
  "core",
  "opencouch_cli",
  "services",
  "voice",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = [
  "aiosqlite",
  "google",
  "google.*",
  "openai",
]
ignore_missing_imports = true
