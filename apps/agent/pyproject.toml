[project]
name = "opencouch-agent"
version = "0.1.0"
description = "OpenCouch companion agent service"
authors = [
    { name = "whanyu1212", email = "whanyu1212@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.142.2",
    # Pinned to a minor: pydantic-ai releases every few days.
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-ai-slim[ag-ui,openai]>=2.54.0,<2.55",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
opencouch-agent = "opencouch_agent.main:run"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "D",        # pydocstyle (Google convention below)
    "N",        # pep8-naming
    "RET",      # return statements
    "ASYNC",    # async pitfalls
    "C90",      # mccabe complexity
    "RUF",      # ruff-specific
]
ignore = [
    "D105",  # magic methods
    "D107",  # __init__ (document the class instead)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
